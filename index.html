<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>심정카페 여섯 번째 밤 — 안암학사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<meta name="theme-color" content="#253b5c">
<style>
  :root {
    --night:#253b5c;
    --moon:#493017;
    --amber:#9c481f;
    --dusk:#795b3b;
    --line:rgba(122,76,33,.2);
    --accent:#9c481f;
    --accent-soft:rgba(156,72,31,.09);
    --paper:#fff2d6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Gowun Dodum',sans-serif;color:var(--moon);background:var(--night);
    line-height:1.75;overflow:hidden;-webkit-font-smoothing:antialiased;}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  button:focus-visible{outline:3px solid #c67d30;outline-offset:4px;}
  button:disabled{cursor:default;}
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:#334969 url('./assets/talk6-chuseok.png') center center / cover no-repeat;}
  .sky::after{content:"";position:absolute;inset:0;background:rgba(26,35,48,.18);
    opacity:0;transition:opacity .45s ease;}
  body[data-scene="paper"] .sky::after{opacity:1;}
  .stars{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.25;
    mask-image:linear-gradient(to bottom,#000,transparent 45%);}
  .masthead{position:fixed;top:27px;left:36px;right:36px;z-index:3;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    color:#fff0cc;text-shadow:0 2px 10px #26334b;font-size:13px;letter-spacing:.12em;pointer-events:none;}
  .masthead .brand{display:flex;align-items:center;gap:10px;font-family:'Gowun Batang',serif;white-space:nowrap;flex-shrink:0;}
  .masthead .brand::before{content:"";width:13px;height:13px;border-radius:50%;
    background:#ffe09b;box-shadow:0 0 16px #ffc97480;}
  .masthead .edition{font-size:11px;letter-spacing:.2em;}
  .bar{position:fixed;top:0;left:0;height:3px;z-index:60;width:0;
    background:linear-gradient(90deg,#c27b3f,#ffe1a1);transition:width .32s ease;}
  .deck{position:relative;z-index:2;height:100%;height:100dvh;}
  .slide{position:absolute;inset:100px 64px 112px;display:none;flex-direction:column;
    justify-content:center;max-width:1120px;margin:0 auto;padding:clamp(30px,4vw,58px);
    border:1px solid rgba(255,228,169,.85);border-radius:22px;
    background:linear-gradient(125deg,rgba(255,247,225,.97),rgba(255,236,196,.95));
    box-shadow:0 22px 70px #30231538,inset 0 0 0 7px #fff7e73d;
    overflow-y:auto;scrollbar-color:#c2a173 transparent;scrollbar-width:thin;}
  .slide::before{content:"";position:absolute;inset:9px;border:1px solid #a56b302b;
    border-radius:15px;pointer-events:none;}
  .slide.on{display:flex;animation:rise .4s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;
    font-size:13px;letter-spacing:.12em;color:var(--accent);padding:5px 13px;
    border:1px solid var(--line);border-radius:999px;background:var(--accent-soft);margin-bottom:18px;}
  h1,h2{font-family:'Gowun Batang',serif;font-weight:700;word-break:keep-all;overflow-wrap:break-word;}
  h1{font-size:clamp(62px,8vw,114px);line-height:1.15;}
  h2{font-size:clamp(30px,3.65vw,50px);line-height:1.45;letter-spacing:-.04em;}
  .sub{color:var(--dusk);font-size:clamp(15px,1.6vw,20px);margin-top:18px;word-break:keep-all;}
  .rule-line{height:1px;flex:none;background:var(--line);margin:24px 0;}
  .cover,.act,.closing{inset:0;max-width:none;padding:0;border:0;border-radius:0;
    background:none;box-shadow:none;overflow:hidden;align-items:center;text-align:center;}
  .cover::before,.act::before,.closing::before{display:none;}
  .moon-copy{position:absolute;left:50%;top:13%;transform:translateX(-50%);
    width:min(620px,65vw);display:flex;flex-direction:column;align-items:center;}
  .cover .eyebrow,.act .eyebrow,.closing .eyebrow{align-self:center;border:0;background:none;
    color:#795021;padding:0;font-size:14px;letter-spacing:.2em;margin-bottom:14px;}
  .cover h1{font-family:'Nanum Brush Script','Gowun Batang',serif;font-weight:400;
    font-size:clamp(94px,9.2vw,138px);line-height:1.05;letter-spacing:-.025em;
    color:#4d2b0c;text-shadow:0 2px 1px #ffedb333;}
  .cover-kicker{font-family:'Gowun Batang',serif;font-size:clamp(17px,1.7vw,24px);
    letter-spacing:.05em;margin-top:6px;color:#6b441e;word-break:keep-all;}
  .ornament{display:flex;align-items:center;justify-content:center;gap:10px;
    color:#ab6d35;width:min(280px,70%);margin:16px auto 12px;}
  .ornament::before,.ornament::after{content:"";height:1px;flex:1;background:currentColor;opacity:.65;}
  .ornament svg{width:27px;height:27px;flex:none;}
  .cover .sub{margin:0;font-family:'Gowun Batang',serif;color:#62451f;
    font-size:clamp(15px,1.5vw,20px);line-height:1.85;}
  .cover .meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:5px 13px;margin-top:20px;color:#7e552a;font-size:12px;}
  .cover .meta span+span::before{content:"·";margin-right:13px;color:#a66d37;}
  .cover-date{font-size:12px;color:#845d32;margin-top:6px;letter-spacing:.06em;}
  .rules{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:0;}
  .rule{display:flex;gap:16px;align-items:flex-start;padding:22px 20px;
    border:1px solid var(--line);border-radius:12px;background:#fff9ea66;}
  .rule .n{font-family:'Gowun Batang',serif;font-size:23px;line-height:1.4;color:var(--accent);flex:none;}
  .rule .t{font-size:20px;word-break:keep-all;}
  .rule .t em{font-style:normal;color:var(--accent);}
  .rule .d{display:block;color:var(--dusk);font-size:15px;line-height:1.8;margin-top:7px;}
  .act .moon-copy{top:19%;}
  .act .num{font-family:'Gowun Batang',serif;font-size:50px;line-height:1;color:#a0642d;
    margin-bottom:20px;opacity:.7;}
  .act h2{font-family:'Nanum Brush Script','Gowun Batang',serif;font-weight:400;
    font-size:clamp(65px,7.5vw,104px);line-height:1.2;letter-spacing:0;color:#4d2b0c;}
  .act .eyebrow{font-size:12px;margin-bottom:10px;}
  .act .sub{font-family:'Gowun Batang',serif;color:#674720;max-width:500px;margin-top:12px;}
  .act .dots{display:flex;justify-content:center;gap:9px;margin-top:24px;}
  .act .dots i{width:6px;height:6px;border-radius:50%;background:#b98a494f;}
  .act .dots i.fill{background:#8e5429;}
  .topic .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:160px;}
  .topic .qno{font-family:'Gowun Batang',serif;font-weight:700;font-size:17px;color:#fff4da;
    background:var(--accent);border-radius:50%;width:38px;height:38px;
    display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .topic .kind{border:1px solid var(--line);border-radius:999px;padding:4px 12px;
    font-size:13px;color:var(--accent);letter-spacing:.06em;}
  .topic .head .eyebrow{border:0;background:none;padding-left:2px;font-size:12px;}
  .topic h2{margin-top:25px;max-width:calc(100% - 160px);}
  .topic h2 .mark{color:var(--accent);text-decoration:underline;text-decoration-color:var(--accent-soft);
    text-decoration-thickness:.2em;text-underline-offset:.05em;text-decoration-skip-ink:none;}
  .topic .sub{max-width:calc(100% - 160px);}
  .follow{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;}
  .follow span{border:1px solid var(--line);border-radius:8px;padding:8px 15px;
    font-size:clamp(13px,1.2vw,16px);color:#765639;background:#fff9ec6b;}
  .follow .lab{width:100%;font-size:11px;color:#9a7652;letter-spacing:.12em;
    margin-bottom:2px;border:0;background:none;padding:0;}
  .timer{position:absolute;right:44px;top:42px;display:flex;flex-direction:column;
    align-items:center;gap:10px;z-index:5;}
  .ring{position:relative;width:112px;height:112px;}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block;}
  .ring .track{fill:none;stroke:#ab7d3e26;stroke-width:3;}
  .ring .prog{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke .35s ease;}
  .ring .read{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Gowun Batang',serif;font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;}
  .timer.warn .ring .prog{stroke:#b96019;}
  .timer.warn .ring .read{color:#b96019;}
  .timer.danger .ring .prog{stroke:#b0392d;}
  .timer.danger .ring .read{color:#b0392d;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .presets,.tctl{display:flex;gap:5px;}
  .presets button,.tctl button{background:#fff7e78c;color:var(--dusk);border:1px solid var(--line);
    border-radius:7px;padding:5px 9px;font-size:12px;min-height:32px;transition:background .18s ease;}
  .presets button:hover,.tctl button:hover{background:#fff8e8;border-color:#b28b58;}
  .presets button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .tctl .go{min-width:62px;color:var(--accent);}
  .tctl .go.running{background:var(--accent);color:#fff6e3;border-color:var(--accent);}
  .closing .moon-copy{top:18%;width:min(640px,68vw);}
  .closing h2{font-size:clamp(29px,3vw,43px);line-height:1.55;color:#4d2b0c;}
  .closing .sub{font-family:'Gowun Batang',serif;color:#674720;font-size:17px;line-height:1.9;}
  .closing .signoff{font-size:13px;color:#80582c;letter-spacing:.08em;}
  .nav{position:fixed;left:50%;bottom:max(6px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;
    display:flex;align-items:center;justify-content:center;gap:12px;padding:7px;
    border:1px solid #ffe8bc94;border-radius:14px;background:#fff0d4eb;
    box-shadow:0 6px 30px #442e2133;backdrop-filter:blur(12px);}
  .nav button{background:transparent;border:1px solid transparent;color:#684628;border-radius:9px;
    min-height:40px;padding:7px 16px;font-size:13px;white-space:nowrap;transition:background .18s ease;}
  .nav button:hover:not(:disabled){background:#9c602818;}
  .nav button:disabled{opacity:.3;}
  .nav #next{background:#82502d;color:#fff3d9;}
  .nav #next:hover:not(:disabled){background:#663c20;}
  .nav .page{color:#9c7a54;font-size:12px;font-variant-numeric:tabular-nums;min-width:61px;text-align:center;letter-spacing:.04em;}
  .nav .page b{color:#684628;font-weight:700;}
  .hint{position:fixed;left:34px;bottom:20px;z-index:50;color:#fff0d1;font-size:11px;
    letter-spacing:.02em;text-shadow:0 1px 5px #3c291d;}
  .sound{position:fixed;right:34px;bottom:13px;z-index:50;background:#3e2e2675;
    border:1px solid #ffe1ae57;border-radius:9px;color:#fff0d1;padding:8px 12px;font-size:11px;
    backdrop-filter:blur(8px);min-height:36px;}
  .sound:hover{background:#3e2e26b0;}
  .zone{position:fixed;top:90px;bottom:110px;width:min(4vw,55px);z-index:10;cursor:pointer;}
  .zone.prev{left:0;}.zone.next{right:0;}
  @media(min-width:821px) and (max-height:820px){
    .masthead{top:19px;}.slide{inset:73px 55px 88px;padding:30px 42px;}
    .cover,.act,.closing{inset:0;padding:0;}.moon-copy{top:13%;}
    .cover h1{font-size:110px;}.cover .eyebrow{margin-bottom:8px;}
    .ornament{margin:12px auto;}.cover .meta{margin-top:12px;}
    .act .moon-copy{top:15%;}.act .num{font-size:38px;margin-bottom:14px;}
    .act h2{font-size:80px;}.act .dots{margin-top:16px;}
    .closing .moon-copy{top:16%;}.closing h2{font-size:36px;}.closing .sub{font-size:16px;}
    .rules{gap:12px;}.rule{padding:15px;}.rule .t{font-size:18px;}.rule .d{font-size:14px;}
    .topic h2{font-size:38px;margin-top:20px;}.follow{margin-top:20px;}
    .timer{top:28px;right:35px;}
  }
  @media(max-width:1000px){.hint{display:none;}.sound{right:22px;}.rules{gap:12px;}.rule{padding:18px 15px;}}
  @media(max-width:820px){
    .masthead{top:22px;left:22px;right:22px;font-size:12px;}.masthead .edition{display:none;}
    .slide{inset:84px 20px 99px;padding:30px 26px;justify-content:flex-start;border-radius:18px;}
    .slide::before{border-radius:11px;}
    h2{font-size:32px;}.eyebrow{font-size:11px;margin-bottom:15px;}.sub{font-size:16px;}
    .cover,.act,.closing{inset:0;padding:0;overflow-y:auto;}
    .moon-copy{left:50%;top:20%;width:88%;}
    .cover h1{font-size:110px;}.cover .eyebrow{font-size:12px;letter-spacing:.14em;}
    .cover-kicker{font-size:19px;}.cover .sub{font-size:17px;}
    .cover .meta{font-size:11px;gap:3px 10px;margin-top:19px;}
    .cover .meta span+span::before{margin-right:10px;}
    .act .moon-copy{top:24%;}.act h2{font-size:78px;}.act .sub{max-width:310px;}
    .act .num{font-size:42px;}.closing .moon-copy{left:50%;top:20%;width:87%;}
    .closing h2{font-size:30px;}.closing .sub{font-size:16px;}.closing .signoff{font-size:12px;}
    .rules{grid-template-columns:1fr;gap:12px;}.rule{padding:16px;}.rule .t{font-size:17px;}
    .rule .n{font-size:20px;}.rule .d{font-size:14px;margin-top:4px;}
    .rule-line{margin:20px 0;}
    .timer{position:static;align-self:stretch;flex-direction:row;flex-wrap:wrap;
      justify-content:flex-start;gap:10px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);}
    .ring{width:74px;height:74px;margin-right:4px;flex:none;}.ring .read{font-size:22px;}
    .presets button,.tctl button{min-height:36px;padding:5px 8px;}
    .topic .head{padding-right:0;gap:8px;}.topic .head .eyebrow{font-size:11px;}
    .topic h2{max-width:none;margin-top:22px;line-height:1.45;}.topic .sub{max-width:none;}
    .follow{margin-top:23px;gap:8px;}.follow span{padding:7px 12px;font-size:13px;}
    .nav{gap:6px;padding:5px;}.nav button{padding:7px 14px;min-height:40px;}
    .sound{top:18px;right:22px;bottom:auto;padding:5px 9px;font-size:10px;min-height:29px;}
    body[data-scene="paper"] .sound{top:18px;right:20px;}
    body[data-scene="paper"] .masthead .edition{visibility:hidden;}
    .zone{display:none;}
  }
  @media(max-width:480px){
    .moon-copy{top:19%;}.cover h1{font-size:94px;}.cover-kicker{font-size:16px;}
    .cover .sub{font-size:15px;}.ornament{margin:18px auto 14px;width:210px;}
    .cover .meta{gap:3px 8px;font-size:10px;}.cover .meta span+span::before{margin-right:8px;}
    .cover-date{font-size:11px;}.slide{padding:26px 23px;}.cover,.act,.closing{padding:0;}
    h2{font-size:28px;}.topic .head .eyebrow{width:100%;padding:0;}
    .timer{gap:7px;}.ring{width:64px;height:64px;margin-right:0;}.ring .read{font-size:20px;}
    .presets,.tctl{gap:3px;}.presets button,.tctl button{font-size:11px;padding:5px 6px;}
    .tctl .go{min-width:51px;}.closing h2{font-size:27px;}.closing .sub{font-size:14px;}
  }
  @media(max-width:820px) and (max-height:740px){
    .cover .moon-copy{top:14%;}.cover h1{font-size:84px;}
    .cover-kicker{font-size:15px;}.cover .sub{font-size:14px;}
    .cover .ornament{margin:12px auto 10px;}.cover .meta{margin-top:12px;}
    .act .moon-copy{top:17%;}.act .num{font-size:32px;margin-bottom:12px;}
    .act h2{font-size:68px;}.act .sub{font-size:15px;}.act .dots{margin-top:16px;}
    .closing .moon-copy{top:16%;}.closing h2{font-size:25px;}.closing .sub{font-size:13px;}
  }
  @media(max-height:600px){
    .slide:not(.cover):not(.act):not(.closing){justify-content:flex-start;}
    .cover .moon-copy{top:13%;}.cover h1{font-size:76px;}.cover .eyebrow{font-size:11px;margin-bottom:5px;}
    .cover-kicker{font-size:16px;}.cover .sub{font-size:14px;}.cover .ornament{margin:10px auto 8px;}
    .cover .meta{margin-top:10px;font-size:10px;}.cover-date{font-size:10px;margin-top:1px;}
    .act .moon-copy{top:16%;}.act .num{font-size:28px;margin-bottom:10px;}.act h2{font-size:62px;}
    .act .sub{font-size:15px;}.closing .moon-copy{top:18%;}.closing h2{font-size:29px;}
    .closing .sub{font-size:14px;}.closing .ornament{margin:10px auto;}
  }
  @media(max-height:520px){
    .cover .moon-copy{top:8%;width:58%;}.cover .eyebrow{font-size:10px;margin-bottom:5px;}
    .cover h1{font-size:58px;}.cover-kicker{font-size:12px;margin-top:2px;}
    .cover .sub{font-size:12px;}.cover .meta{font-size:10px;margin-top:8px;}
    .cover-date{font-size:9px;margin-top:0;}
    .cover .ornament,.act .ornament,.closing .ornament{width:170px;margin:7px auto 5px;}
    .ornament svg{width:18px;height:18px;}
    .act .moon-copy{top:12%;}.act .num{font-size:24px;margin-bottom:8px;}
    .act .eyebrow{font-size:10px;margin-bottom:8px;}.act h2{font-size:52px;}
    .act .sub{font-size:12px;line-height:1.6;margin-top:8px;}.act .dots{margin-top:10px;}
    .closing .moon-copy{top:13%;}.closing .eyebrow{font-size:10px;margin-bottom:8px;}
    .closing h2{font-size:21px;line-height:1.4;}.closing .sub{font-size:11px;line-height:1.5;margin-top:8px;}
    .closing .signoff{font-size:9px;margin-top:10px !important;}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
  }
  @media print{
    @page{size:A4 landscape;margin:14mm;}
    body{background:#fff;color:#14161c;overflow:visible;height:auto;}
    .sky,.stars,.masthead,.bar,.nav,.hint,.sound,.zone,.timer{display:none !important;}
    .deck{height:auto;}
    .slide{display:flex !important;position:static;break-after:page;page-break-after:always;
      min-height:170mm;padding:12mm;max-width:none;overflow:visible;border:0;box-shadow:none;
      background:none;animation:none;justify-content:center;}
    .slide::before{display:none;}.slide:last-child{break-after:auto;page-break-after:auto;}
    .moon-copy{position:static;transform:none;width:100% !important;}
    h1,h2,.cover h1,.act h2,.closing h2,.topic h2 .mark,.act .num,.rule .n,.eyebrow{color:#14161c;}
    .eyebrow{background:none;border-color:#bbb;}.topic .qno{background:#eee;color:#14161c;}
    .sub,.follow .lab,.rule .d{color:#555;}.rule,.follow span{border-color:#ccc;background:none;}
    .topic h2,.topic .sub{max-width:none;}.topic .head{padding:0;}
    .ornament{color:#999;}.rules{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<header class="masthead"><span class="brand">심정카페 <span>·</span> 안암학사</span><span class="edition">여섯 번째 밤 &nbsp; / &nbsp; 한가위 이야기</span></header>
<canvas class="stars" id="stars" aria-hidden="true"></canvas>
<div class="bar" id="bar"></div>

<div class="deck" id="deck"></div>

<div class="zone prev" id="zprev" aria-hidden="true"></div>
<div class="zone next" id="znext" aria-hidden="true"></div>

<div class="hint">← → 넘기기 · T 타이머 · R 리셋</div>
<nav class="nav" aria-label="슬라이드 이동">
  <button id="prev" aria-label="이전 슬라이드">← 이전</button>
  <div class="page"><b id="cur">1</b> / <span id="tot">18</span></div>
  <button id="next" aria-label="다음 슬라이드">다음 →</button>
</nav>
<button class="sound" id="sound" aria-label="알림음 켜기 끄기" aria-pressed="true">🔔 알림음 켜짐</button>

<script>
(function(){
  "use strict";

  /* ── 데이터 ─────────────────────────────────────────── */
  const ACTS = [
    { no:"Act 1", name:"명절 풍경",   tag:"가볍게 시작해요",
      line:"전 부치는 냄새부터, 올해 추석 이야기.",
      accent:"#9c481f", soft:"rgba(156,72,31,.1)" },
    { no:"Act 2", name:"고향과 나",   tag:"한 걸음 더",

      sub:"오늘 밤, 딱 하나만 말해도 됩니다.",
      follow:["왜 그 소원이에요?","언제부터 빌고 싶었어요?"] },
    { act:2, kind:"기억", title:"명절이면 생각나는, <span class='mark'>지금은 곁에 없는 사람</span>",

    { act:2, kind:"마음", title:"가족에게 <span class='mark'>못했던 말</span>, 지금 여기서 해본다면",
      sub:"누구에게, 어떤 말인지 편하게.",
      follow:["왜 못 했어요?","이번에 만나면 할 수 있을까요?"] }
  ];

  const RULES = [
    ["정답은 없습니다", "떠오르는 대로, 정리 안 된 채로 말해도 괜찮아요."],
    ["언제든 <em>패스</em>", "말하기 어려운 주제는 그냥 “패스”라고 하면 됩니다."],
    ["여기서 나온 이야기는 여기서", "밖으로 옮기지 않기. 그래야 편하게 말할 수 있어요."],
    ["말한 사람보다 <em>들은 사람</em>", "끊지 않고 끝까지 듣는 것이 오늘의 핵심입니다."]
  ];

  /* ── 슬라이드 생성 ───────────────────────────────────── */
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const deck = document.getElementById("deck");
  const slides = [];   // {el, act, isTopic}

  function add(html, act, isTopic, cls){
    const el = document.createElement("section");
    el.className = "slide " + (cls||"");
    el.innerHTML = html;
    deck.appendChild(el);
    slides.push({ el, act, isTopic:!!isTopic });
  }

  const timerHTML = `
    <div class="timer" data-timer>
      <div class="ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="44"></circle>
          <circle class="prog" cx="50" cy="50" r="44"></circle>
        </svg>
        <div class="read" data-read role="timer" aria-live="off">4:00</div>
      </div>
      <div class="presets" role="group" aria-label="시간 선택">
        <button data-min="3" aria-pressed="false">3분</button>
        <button data-min="4" aria-pressed="true">4분</button>
        <button data-min="5" aria-pressed="false">5분</button>
      </div>
      <div class="tctl">
        <button class="go" data-go aria-label="타이머 시작">시작</button>
        <button data-reset aria-label="타이머 리셋">리셋</button>
      </div>
    </div>`;

  const ornament = `<div class="ornament" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="18" cy="12" rx="6" ry="10"/><ellipse cx="18" cy="24" rx="6" ry="10"/><ellipse cx="12" cy="18" rx="10" ry="6"/><ellipse cx="24" cy="18" rx="10" ry="6"/></svg></div>`;

  // 1. 표지 — 그림 위의 글자는 HTML로 유지합니다.
  const today = new Date();
  const dstr = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;
  add(`
    <div class="moon-copy">
      <span class="eyebrow">안암학사 · 여섯 번째 밤</span>
      <h1>심정카페</h1>
      <p class="cover-kicker">보름달처럼 넉넉한, 우리의 이야기</p>
      ${ornament}
      <p class="sub">이번엔 추석 이야기입니다.<br>고향, 가족, 그리고 지금 여기 — 열두 가지 질문.</p>
      <div class="meta"><span>주제 12개</span><span>주제당 3~5분</span><span>약 45~60분</span></div>
      <p class="cover-date">${esc(dstr)}</p>
    </div>`, 0, false, "cover");

  // 2. 진행 안내
  add(`
    <span class="eyebrow">시작하기 전에</span>
    <h2>네 가지만 지켜주세요</h2>
    <div class="rule-line"></div>
    <div class="rules">
      ${RULES.map((r,i)=>`
        <div class="rule">
          <span class="n">0${i+1}</span>
          <span class="t">${r[0]}<span class="d">${r[1]}</span></span>
        </div>`).join("")}
    </div>`, 0, false, "");

  // 3. Act 인트로 + 주제
  ACTS.forEach((a, ai) => {
    add(`
      <div class="moon-copy">
      <div class="num">0${esc(a.no.replace("Act ",""))}</div>
      <span class="eyebrow">${esc(a.no)} · ${esc(a.tag)}</span>
      <h2>${esc(a.name)}</h2>
      <p class="sub">${esc(a.line)}</p>
      <div class="dots">${ACTS.map((_,i)=>`<i class="${i<=ai?'fill':''}"></i>`).join("")}</div>
      ${ornament}
      </div>
    `, ai, false, "act");

    TOPICS.forEach((t, ti) => {
      if (t.act !== ai) return;
      add(`
        ${timerHTML}
        <div class="head">
          <span class="qno">${ti+1}</span>
          <span class="kind">${esc(t.kind)}</span>
          <span class="eyebrow" style="margin-bottom:0">${esc(a.no)} · ${esc(a.name)}</span>
        </div>
        <h2>${t.title}</h2>
        <p class="sub">${esc(t.sub)}</p>
        <div class="follow">
          <span class="lab">이야기가 멈추면</span>
          ${t.follow.map(f=>`<span>${esc(f)}</span>`).join("")}
        </div>`, ai, true, "topic");
    });
  });

  // 마지막
  add(`
    <div class="moon-copy">
      <span class="eyebrow">마음을 나눈 오늘 밤</span>
      <h2>오늘 들은 이야기 중<br>가장 오래 남을 한 마디는?</h2>
      ${ornament}
      <p class="sub">한 사람씩 딱 한 문장으로 나누고 마칩니다.<br>
        오늘 이 자리에서 나온 이야기는,<br>오늘 이 자리에 두고 가요.</p>
      <p class="signoff" style="margin-top:20px">들어줘서 고맙습니다 · 안암학사</p>
    </div>`, 2, false, "closing");

  /* ── 네비게이션 ─────────────────────────────────────── */
  const TOTAL = slides.length;
  document.getElementById("tot").textContent = TOTAL;
  const bar = document.getElementById("bar");
  const curEl = document.getElementById("cur");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  let idx = 0;

  function applyAccent(i){
    const a = ACTS[slides[i].act] || ACTS[0];
    document.documentElement.style.setProperty("--accent", a.accent);
    document.documentElement.style.setProperty("--accent-soft", a.soft);
  }

  function show(i, push){
    i = Math.max(0, Math.min(TOTAL - 1, i));
    if (slides[idx]) resetTimerIn(slides[idx].el);
    slides[idx].el.classList.remove("on");
    idx = i;
    slides[idx].el.classList.add("on");
    slides[idx].el.scrollTop = 0;
    document.body.dataset.scene = slides[idx].el.matches(".cover,.act,.closing") ? "moon" : "paper";
    applyAccent(idx);
    curEl.textContent = idx + 1;
    bar.style.width = ((idx + 1) / TOTAL * 100) + "%";
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === TOTAL - 1;
    if (push !== false) {
      const h = "#" + (idx + 1);
      if (location.hash !== h) history.replaceState(null, "", h);
    }
  }
  const go = d => show(idx + d);

  prevBtn.addEventListener("click", () => go(-1));
  nextBtn.addEventListener("click", () => go(1));
  document.getElementById("zprev").addEventListener("click", () => go(-1));
  document.getElementById("znext").addEventListener("click", () => go(1));

  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input,textarea,select,[contenteditable]")) return;
    if (e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
    switch (e.key) {
      case "ArrowRight": case "PageDown": case " ": e.preventDefault(); go(1); break;
      case "ArrowLeft":  case "PageUp":            e.preventDefault(); go(-1); break;
      case "Home": e.preventDefault(); show(0); break;
      case "End":  e.preventDefault(); show(TOTAL - 1); break;
      case "t": case "T": toggleTimerIn(slides[idx].el); break;
      case "r": case "R": resetTimerIn(slides[idx].el); break;
    }
  });

  window.addEventListener("hashchange", () => {
    const n = parseInt(location.hash.slice(1), 10);
    if (n >= 1 && n <= TOTAL && n - 1 !== idx) show(n - 1, false);
  });

  /* ── 타이머 ─────────────────────────────────────────── */
  const R = 44, C = 2 * Math.PI * R;
  let soundOn = true;
  const soundBtn = document.getElementById("sound");
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundBtn.textContent = soundOn ? "🔔 알림음 켜짐" : "🔕 알림음 꺼짐";
  });

  let audioCtx = null;
  function beep(){
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      [0, 0.42].forEach(delay => {
        const t = audioCtx.currentTime + delay;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(660, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.11, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.36);
      });
    } catch (_) { /* 오디오 불가 환경은 조용히 무시 */ }
  }

  const timers = new Map();  // timerEl -> state

  function fmt(ms){
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function paint(st){
    const left = st.running
      ? Math.max(0, st.endAt - performance.now())
      : st.remain;
    st.read.textContent = fmt(left);
    const ratio = st.total ? Math.max(0, left / st.total) : 0;
    st.prog.style.strokeDasharray = C;
    st.prog.style.strokeDashoffset = C * (1 - ratio);
    const secs = left / 1000;
    st.el.classList.toggle("warn",  secs <= 60 && secs > 20);
    st.el.classList.toggle("danger", secs <= 20);
    if (st.running && left <= 0) {
      st.running = false; st.remain = 0;
      st.go.textContent = "시작"; st.go.classList.remove("running");
      beep();
    }
  }

  function tick(st){
    if (!st.running) return;
    paint(st);
    if (st.running) st.raf = requestAnimationFrame(() => tick(st));
  }

  function initTimer(el){
    const st = {
      el,
      read: el.querySelector("[data-read]"),
      prog: el.querySelector(".prog"),
      go:   el.querySelector("[data-go]"),
      total: 4 * 60 * 1000,
      remain: 4 * 60 * 1000,
      running: false,
      endAt: 0,
      raf: 0
    };
    timers.set(el, st);

    el.querySelectorAll("[data-min]").forEach(b => {
      b.addEventListener("click", () => {
        el.querySelectorAll("[data-min]").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        st.total = st.remain = parseInt(b.dataset.min, 10) * 60 * 1000;
        stop(st); paint(st);
      });
    });
    st.go.addEventListener("click", () => toggle(st));
    el.querySelector("[data-reset]").addEventListener("click", () => { reset(st); });
    paint(st);
  }

  function stop(st){
    st.running = false;
    cancelAnimationFrame(st.raf);
    st.go.textContent = "시작";
    st.go.classList.remove("running");
  }
  function toggle(st){
    if (st.running) {
      st.remain = Math.max(0, st.endAt - performance.now());
      stop(st); paint(st);
    } else {
      if (st.remain <= 0) st.remain = st.total;
      st.endAt = performance.now() + st.remain;
      st.running = true;
      st.go.textContent = "일시정지";
      st.go.classList.add("running");
      if (soundOn && !audioCtx) {           // 사용자 제스처 시점에 오디오 준비
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
      }
      tick(st);
    }
  }
  function reset(st){ stop(st); st.remain = st.total; paint(st); }

  function timerOf(slideEl){
    const el = slideEl.querySelector("[data-timer]");
    return el ? timers.get(el) : null;
  }
  function resetTimerIn(slideEl){ const st = timerOf(slideEl); if (st) reset(st); }
  function toggleTimerIn(slideEl){ const st = timerOf(slideEl); if (st) toggle(st); }

  document.querySelectorAll("[data-timer]").forEach(initTimer);

  /* ── 시작 ───────────────────────────────────────────── */
  const start = parseInt(location.hash.slice(1), 10);
  slides[0].el.classList.add("on");
  show((start >= 1 && start <= TOTAL) ? start - 1 : 0);
})();

/* ══ 밤하늘 별밭 — 은은한 반짝임 + 느린 드리프트 + 가끔 별똥별 ══ */
(function(){
  "use strict";

  const cv = document.getElementById("stars");
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const rand = (a, b) => a + Math.random() * (b - a);
  const TINTS = [
    [255,255,255], [255,255,255], [255,255,255], [255,255,255],
    [255,255,255], [255,255,255], [255,255,255],
    [255,232,200], [205,222,255]          // 12% 정도만 따뜻/차가운 색
  ];

  const LEAF_TINTS = [[214,163,90],[198,140,86],[176,120,70]];
  let W = 0, H = 0, stars = [], leaves = [];

  function buildLeaves(){
    const n = Math.min(10, Math.round(W * H / 160000) + 4);
    leaves = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: rand(3, 5.5),
      rot: rand(0, Math.PI * 2),
      spin: rand(-0.3, 0.3),
      sway: rand(0.3, 0.7),
      phase: Math.random() * Math.PI * 2,
      vy: rand(4, 9),                                      // px/s — 은은하게 낙하
      base: rand(0.14, 0.3),
      tint: LEAF_TINTS[(Math.random() * LEAF_TINTS.length) | 0]
    }));
  }

  function drawLeaf(l){
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.fillStyle = "rgba(" + l.tint[0] + "," + l.tint[1] + "," + l.tint[2] + "," + l.base.toFixed(3) + ")";
    ctx.beginPath();
    ctx.ellipse(0, 0, l.r, l.r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function build(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const n = Math.min(220, Math.round(W * H / 9000));
    stars = Array.from({ length: n }, () => {
      const dir = rand(Math.PI * 0.86, Math.PI * 1.16);   // 대체로 왼쪽, 살짝 위아래
      const sp  = rand(0.12, 0.4);                         // px/s — 1분에 10~25px
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: rand(0.4, 1.5),
        base: rand(0.22, 0.62),
        phase: Math.random() * Math.PI * 2,
        tw: rand(0.15, 0.5),                               // rad/s, 별마다 다른 리듬
        vx: Math.cos(dir) * sp,
        vy: Math.sin(dir) * sp * 0.35,
        tint: TINTS[(Math.random() * TINTS.length) | 0]
      };
    });
    buildLeaves();
  }

  /* ── 별똥별 ── */
  let shot = null, nextShot = rand(4, 9);

  function spawnShot(){
    const ang = rand(18, 32) * Math.PI / 180;              // 우하향
    return {
      x: rand(-0.05, 0.8) * W,
      y: rand(0, 0.65) * H,
      dx: Math.cos(ang), dy: Math.sin(ang),
      len: rand(90, 170),
      life: 0,
      dur: rand(0.8, 1.2),
      dist: rand(320, 560)
    };
  }

  function drawShot(s){
    const p = s.life / s.dur;
    // 등장·소멸 부드럽게 (0 → 1 → 0)
    const a = Math.sin(Math.PI * Math.min(1, Math.max(0, p))) * 0.85;
    const hx = s.x + s.dx * s.dist * p, hy = s.y + s.dy * s.dist * p;
    const tx = hx - s.dx * s.len,       ty = hy - s.dy * s.len;
    const g = ctx.createLinearGradient(hx, hy, tx, ty);
    g.addColorStop(0,   "rgba(255,248,232," + a.toFixed(3) + ")");
    g.addColorStop(0.4, "rgba(255,240,214," + (a * 0.35).toFixed(3) + ")");
    g.addColorStop(1,   "rgba(255,240,214,0)");
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
  }

  /* ── 프레임 ── */
  let t = 0;
  function draw(dt){
    t += dt;
    ctx.clearRect(0, 0, W, H);

    for (const s of stars) {
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < -2) s.x = W + 2; else if (s.x > W + 2) s.x = -2;
      if (s.y < -2) s.y = H + 2; else if (s.y > H + 2) s.y = -2;
      const a = s.base * (0.58 + 0.42 * Math.sin(s.phase + t * s.tw));
      ctx.fillStyle = "rgba(" + s.tint[0] + "," + s.tint[1] + "," + s.tint[2] + "," + a.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    for (const l of leaves) {
      l.y += l.vy * dt;
      l.x += Math.sin(t * l.sway + l.phase) * 6 * dt;
      l.rot += l.spin * dt;
      if (l.y > H + 8) { l.y = -8; l.x = Math.random() * W; }
      drawLeaf(l);
    }

    if (calm) return;
    if (shot) {
      shot.life += dt;
      if (shot.life >= shot.dur) { shot = null; nextShot = rand(12, 24); }
      else drawShot(shot);
    } else {
      nextShot -= dt;
      if (nextShot <= 0) shot = spawnShot();
    }
  }

  /* ── 루프 ── */
  let raf = 0, last = 0;
  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000);   // 탭 복귀 시 큰 점프 방지
    last = now;
    draw(dt);
    raf = requestAnimationFrame(frame);
  }
  function play(){
    if (calm || raf) return;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function pause(){ cancelAnimationFrame(raf); raf = 0; }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pause(); else play();
  });

  let rt = 0;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { build(); if (calm) draw(0); }, 150);
  });

  build();
  if (calm) draw(0); else play();
})();
</script>
</body>
</html>
